name: Truth Detective Android CI

on:
  push:
    branches: [ "main", "merge/truth-detective-native" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-emulator-smoke-test:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: "platform-tools platforms;android-35 build-tools;35.0.0"

      - name: Install Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        run: gradle assembleDebug

      - name: Launch app in Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          # GitHub-hosted runners do not expose KVM to the emulator.
          # Explicitly allow the Android emulator's slower TCG software mode.
          ANDROID_I_WANT_MY_TCG: "yes"
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect
          disable-animations: true
          script: |
            mkdir -p test-results
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            adb shell am force-stop uk.co.gazai
            adb shell monkey -p uk.co.gazai -c android.intent.category.LAUNCHER 1
            sleep 25
            python3 - <<'PY'
            import pathlib
            import subprocess
            import sys

            results = pathlib.Path("test-results")
            results.mkdir(exist_ok=True)

            pid = subprocess.run(
                ["adb", "shell", "pidof", "uk.co.gazai"],
                capture_output=True, text=True
            )
            logs = subprocess.run(
                ["adb", "logcat", "-d", "-t", "4000"],
                capture_output=True, text=True
            ).stdout
            (results / "logcat.txt").write_text(logs)

            if pid.returncode != 0 or not pid.stdout.strip():
                (results / "emulator-smoke-test.txt").write_text(
                    "FAIL: Truth Detective did not remain running after launch.\\n"
                )
                sys.exit(1)

            crash_markers = (
                "FATAL EXCEPTION",
                "Process: uk.co.gazai, PID:",
            )
            if any(marker in logs for marker in crash_markers):
                (results / "emulator-smoke-test.txt").write_text(
                    "FAIL: A fatal crash marker was detected during launch.\\n"
                )
                sys.exit(1)

            (results / "emulator-smoke-test.txt").write_text(
                "PASS: Truth Detective installed and remained running for 25 seconds in the Android emulator.\\n"
            )
            print("PASS: Truth Detective remained running for 25 seconds.")
            PY

      - name: Upload APK and emulator test report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: truth-detective-build-and-test
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            test-results/
          if-no-files-found: warn
          retention-days: 14
